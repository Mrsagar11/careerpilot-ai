version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: careerpilot_postgres
    restart: always
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilotpassword2026
      POSTGRES_DB: careerpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpilot_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://careerpilot:careerpilotpassword2026@postgres:5432/careerpilot_db
      - SECRET_KEY=careerpilot_super_secret_jwt_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerpilot_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
